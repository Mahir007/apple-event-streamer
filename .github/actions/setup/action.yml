name: Set up build
description: >-
  Installs the Go version pinned in .go-version, restores the Go module and
  build/test caches, and installs the archive tools used by `make package`
  (cached as .debs so later runs skip apt-get update).

outputs:
  go-cache-paths:
    description: Directories to pass to actions/cache/save.
    value: ${{ steps.go-env.outputs.paths }}
  go-cache-key:
    description: Key to save the Go caches under.
    value: ${{ steps.go-env.outputs.key }}
  go-cache-hit:
    description: '"true" when the exact key was restored (nothing new to save).'
    value: ${{ steps.go-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: .go-version
        # Caching is handled below: setup-go's own cache has no fallback
        # keys, so any go.sum change would mean a cold build.
        cache: false

    - name: Check toolchain
      shell: bash
      run: test "$(go env GOVERSION)" = "go$(cat .go-version)"

    - name: Locate Go caches
      id: go-env
      shell: bash
      run: |
        prefix="go-${ImageOS:-unknown}-$(uname -m)-$(go env GOVERSION)"
        deps="$prefix-$(sha256sum go.sum | cut -c1-16)"
        {
          echo "prefix=$prefix"
          echo "deps=$deps"
          echo "key=$deps-$GITHUB_SHA"
        } >> "$GITHUB_OUTPUT"
        {
          echo "paths<<EOF"
          go env GOCACHE GOMODCACHE
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # Restore the newest cache: same commit, else same go.sum, else any
    # cache for this Go version. Go only rebuilds what changed and trims
    # entries unused for a few days by itself. Saving is done by the
    # workflow after a successful build on main (see ci.yml).
    - name: Restore Go caches
      id: go-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-env.outputs.paths }}
        key: ${{ steps.go-env.outputs.key }}
        restore-keys: |
          ${{ steps.go-env.outputs.deps }}-
          ${{ steps.go-env.outputs.prefix }}-

    - name: Identify runner image
      id: image
      shell: bash
      run: echo "id=${ImageOS:-unknown}-$(uname -m)" >> "$GITHUB_OUTPUT"

    # zip and xz ship with the runner image; advzip (zopfli) does not.
    - name: Restore packaging tools
      id: debs
      uses: actions/cache@v6
      with:
        path: ~/.cache/packaging-debs
        key: packaging-debs-${{ steps.image.outputs.id }}-advancecomp-v1

    - name: Install packaging tools
      shell: bash
      env:
        CACHE_HIT: ${{ steps.debs.outputs.cache-hit }}
      run: |
        dir=~/.cache/packaging-debs
        if [ "$CACHE_HIT" != true ]; then
          sudo apt-get update -q
          mkdir -p "$dir" && (cd "$dir" && apt-get download advancecomp)
        fi
        sudo dpkg -i "$dir"/*.deb >/dev/null
        command -v zip xz advzip
