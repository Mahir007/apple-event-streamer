# Temporary. Tests the real Android archive on emulators with Termux and the
# mpv app, which CI can't otherwise do. Delete it before this branch merges.
name: Android probe

on:
  push:
    branches: [feat/android-universal-build]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  MPV_APK: https://github.com/mpv-android/mpv-android/releases/download/2026-09-17/app-default-x86_64-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-name: build
          packaging: 'true'
      - run: make package VERSION=v0.0.0-probe
      - uses: actions/upload-artifact@v7
        with:
          name: probe-archive
          path: dist/apple-event-streamer_v0.0.0-probe_android-amd64.tar.xz
          retention-days: 5
          if-no-files-found: error

  emulator:
    name: emulator (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # The mpv app's minimum. Needs Termux's build for Android 5 and 6.
          - name: android-6
            api: '23'
            target: google_apis
            termux: https://github.com/termux/termux-app/releases/download/v0.119.0-beta.3/termux-app_v0.119.0-beta.3%2Bapt-android-5-github-debug_x86_64.apk
          # This emulator's hardware decoder hangs mpv, whatever the source.
          - name: android-11
            api: '30'
            target: google_apis
            termux: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_x86_64.apk
            hwdec-no: '1'
          - name: android-17
            api: '37.0'
            target: google_apis
            termux: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_x86_64.apk
          # Termux from Google Play, the newest debug build with an APK attached.
          # The GitHub build can't start its own shell on 16 KB pages.
          - name: android-17-16k
            api: '37.0'
            target: google_apis_ps16k
            termux: https://github.com/termux-play-store/termux-apps/releases/download/termux-app-googleplay.2026.02.11/termux-app-debug-googleplay.2026.02.11.apk
          - name: android-17-play
            api: '37.0'
            target: google_apis
            termux: https://github.com/termux-play-store/termux-apps/releases/download/termux-app-googleplay.2026.02.11/termux-app-debug-googleplay.2026.02.11.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: probe-archive
          path: probe-archive
      - name: Download the apps
        env:
          TERMUX_APK: ${{ matrix.termux }}
        run: |
          mkdir apks
          curl -fsSL -o apks/termux.apk "$TERMUX_APK"
          curl -fsSL -o apks/mpv.apk "$MPV_APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MPV_HWDEC_NO: ${{ matrix.hwdec-no }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/android-probe/host.sh probe-archive/apple-event-streamer_v0.0.0-probe_android-amd64.tar.xz apks probe-out
      - name: Summary
        if: always()
        run: cat probe-out/summary.md >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: probe-out/
          retention-days: 5
