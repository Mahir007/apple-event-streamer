# Temporary. Finds out what Android does with our binaries and the mpv app, to
# decide how the Android build works. Delete it before this branch merges.
name: Android probe

on:
  push:
    branches: [feat/android-universal-build]
    paths:
      - .github/android-probe/**
      - .github/workflows/android-probe.yml

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  NDK_VERSION: 29.0.14206865
  TERMUX_APK: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_x86_64.apk
  MPV_APK: https://github.com/mpv-android/mpv-android/releases/download/2026-09-17/app-default-x86_64-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - run: bash .github/android-probe/build.sh probe-bin
      - uses: actions/upload-artifact@v7
        with:
          name: probe-bin
          path: probe-bin/
          retention-days: 5
          if-no-files-found: error

  emulator:
    name: emulator (API ${{ matrix.api }} ${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: '30', target: google_apis }
          - { api: '37.0', target: google_apis }
          - { api: '37.0', target: google_apis_ps16k }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: probe-bin
          path: probe-bin
      - name: Download the apps
        run: |
          mkdir apks
          curl -fsSL -o apks/termux.apk "$TERMUX_APK"
          curl -fsSL -o apks/mpv.apk "$MPV_APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/android-probe/host.sh probe-bin apks probe-out
      - name: Summary
        if: always()
        run: cat probe-out/summary.md >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-api-${{ matrix.api }}-${{ matrix.target }}
          path: probe-out/
          retention-days: 5

  # Whether termux-docker can be the check job for each architecture. It has
  # bionic and Termux's packages but not Android's seccomp filter or apps.
  termux-docker:
    name: termux-docker (${{ matrix.image }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: x86_64, bin: aes-android }
          - { runner: ubuntu-24.04-arm, image: aarch64, bin: aes-android-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: probe-bin
          path: probe-bin
      - env:
          IMAGE: termux/termux-docker:${{ matrix.image }}
          BIN: ${{ matrix.bin }}
        run: bash .github/android-probe/docker.sh "$IMAGE" "$BIN" | tee -a "$GITHUB_STEP_SUMMARY"
