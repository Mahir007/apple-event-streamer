name: CI

# Tests and builds every push and pull request. Packages are kept as a
# workflow artifact; nothing is published (releases come from tags, see
# release.yml).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # .go-version pins the Go release used for every build. It also sets the
  # oldest supported macOS: Go 1.26 is the last release that targets
  # macOS 12 Monterey (Go 1.27 requires 13). Never switch automatically.
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        id: setup

      - name: Test
        run: make vet test race lint

      - name: Build packages
        run: make package VERSION="ci-${GITHUB_SHA::7}"

      # Only main saves Go caches; branches, pull requests and tags restore
      # main's, which keeps the cache storage from filling with duplicates.
      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.go-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.go-cache-paths }}
          key: ${{ steps.setup.outputs.go-cache-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: apple-event-streamer-${{ github.sha }}
          path: dist/
          if-no-files-found: error
