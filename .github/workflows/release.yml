name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # .go-version pins the Go release used for every build. It also sets the
  # oldest supported macOS: Go 1.26 is the last release that targets
  # macOS 12 Monterey (Go 1.27 requires 13). Never switch automatically.
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test
        run: make vet test race lint

      - name: Build packages
        run: make package VERSION="$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.xz dist/*.zip dist/*.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            flags=()
            # Tags like v1.2.0-rc.1 become pre-releases.
            [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
          fi
